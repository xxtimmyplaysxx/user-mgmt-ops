images:
  backend:
    tag: fd1e6343585fdf92ba437e929d23cabe1f894133
  frontend:
    tag: fd1e6343585fdf92ba437e929d23cabe1f894133
replicas:
  backend: 1
  frontend: 1
# The first k6 run exhausted the JVM's automatic 128Mi heap during concurrent
# Argon2 checks. Bound HTTP concurrency and leave native-memory room below 512Mi.
backendEnv:
  JAVA_TOOL_OPTIONS: '-Xms128m -Xmx256m -XX:+ExitOnOutOfMemoryError'
  SERVER_TOMCAT_THREADS_MAX: '8'
  SERVER_TOMCAT_THREADS_MINSPARE: '2'
  SPRING_JPA_SHOW_SQL: 'false'
resources:
  backend:
    requests: { cpu: 250m, memory: 384Mi }
    limits: { cpu: '1', memory: 512Mi }
backendProbes:
  startup:
    timeoutSeconds: 5
  liveness:
    timeoutSeconds: 5
    failureThreshold: 6
  readiness:
    timeoutSeconds: 3
config:
  hibernateDdlAuto: update
  jwtIssuer: user-mgmt-staging
  datasourceUrl: jdbc:postgresql://user-mgmt-postgres:5432/usermgmt_staging
  backendApiUrl: http://user-mgmt-backend:8080
  postgresDatabase: usermgmt_staging
ingress:
  host: staging-user-mgmt-k8s-nt.duckdns.org
autoscaling:
  enabled: true
  minReplicas: 1
  maxReplicas: 2
  # 60% of 250m = 150m per pod; idle CPU should not trigger repeated scaling.
  targetCPUUtilizationPercentage: 60
  scaleDownStabilizationSeconds: 60
podDisruptionBudget:
  enabled: true
  minAvailable: 1
quota:
  enabled: true
  requestsCpu: "1"
  requestsMemory: 2Gi
  # Room for two backend replicas, module, k6 and rolling-update surge pods.
  limitsCpu: "5"
  limitsMemory: 4Gi
networkPolicy:
  enabled: true
# Managed-PG TLS connections and all six post-cutover E2E cases passed on 2026-09-27.
# Retire the old in-cluster DB/PVC; the verified source archive remains local.
postgres:
  enabled: false
managedDatabase:
  enabled: true
  cidr: 10.114.0.2/32
module:
  enabled: true
  image:
    tag: fd1e6343585fdf92ba437e929d23cabe1f894133
  databaseCidr: 10.114.0.5/32
monitoring:
  enabled: true
